
# Forensic Orchestrator — Central Configuration

orchestrator:
  # HTTP listener (receives alerts from forensic_dispatch.sh)
  listen_host: "127.0.0.1"
  listen_port: 8080
  ingest_path: "/api/v1/ingest"
  debounce_window_seconds: 300   # incident correlation window (NIST SP 800-61)

  # Where case folders are written
  cases_root: "/opt/forensic-orchestrator/storage/cases"

  # Master log
  log_file: "/opt/forensic-orchestrator/logs/orchestrator.log"


# Target endpoint (the Agent we collect evidence FROM)

agent:
  host: "192.168.64.10"
  user: "root"
  ssh_key: "/home/wazuhadmin/.ssh/forensic_key"
  ssh_opts: "-c aes128-gcm@openssh.com -o StrictHostKeyChecking=no -o ConnectTimeout=10"

# ----------------------------------------------------------------
# Collection settings
# ----------------------------------------------------------------
collection:
  # Memory acquisition method: kcore | kcore_segments | none
  memory_method: "kcore_segments"
  # Cap memory dump size for demo (bytes). 0 = full.
  # 256 MiB keeps demo fast; documented as configurable in thesis.
  memory_max_bytes: 268435456
  # --- stratum B (corrected memory acquisition); see collectors/memory.py ---
  # memory_method: kcore = legacy v2 (stratum A) | kcore_segments = LiME (stratum B) | none
  # order: legacy = process/network -> logs -> filesystem -> memory (v2)
  #        rfc3227 = process/network -> memory -> logs -> filesystem (stratum B)
  order: "rfc3227"
  memory_segments_max_bytes: 0            # 0 = all physical RAM (kcore_segments only)
  memory_reserve_bytes: 2147483648        # free space that must remain after a worst-case image
  memory_timeout_seconds: 900

  # Critical files to preserve (forensic interest)
  critical_files:
    - "/etc/passwd"
    - "/etc/shadow"
    - "/etc/sudoers"
    - "/etc/crontab"
    - "/etc/ssh/sshd_config"
    - "/root/.bash_history"
    - "/var/log/auth.log"

  # Directories to capture metadata (FS timeline)
  metadata_dirs:
    - "/etc"
    - "/tmp"
    - "/var/tmp"
    - "/home"
    - "/root"

# ----------------------------------------------------------------
# Analyzers
# ----------------------------------------------------------------
analyzers:
  volatility:
    enabled: false
    # vol executable
    vol_bin: "/home/wazuhadmin/.local/bin/vol"
    # Reference image used for demonstration (ARM kernel symbols unavailable)
    reference_image: "/opt/forensic-orchestrator/reference/linux-sample-1.bin"
    # Plugins to run (Linux)
    plugins:
      - "linux.pslist.PsList"
      - "linux.pstree.PsTree"
      - "linux.bash.Bash"
      - "linux.lsof.Lsof"
    # demonstration_mode tags findings in the report as reference-image based
    demonstration_mode: true

  tsk:
    enabled: true
    fls_bin: "/usr/bin/fls"
    mactime_bin: "/usr/bin/mactime"
    icat_bin: "/usr/bin/icat"
    mmls_bin: "/usr/bin/mmls"

# ----------------------------------------------------------------
# Chain of custody
# ----------------------------------------------------------------
chain_of_custody:
  custody_log: "/opt/forensic-orchestrator/chain_of_custody/custody_log.json"
  analyst: "Sabina Tursunova"
  organization: "Politecnico di Torino"

lifecycle:
  enabled: true
  hot_days: 7
  cold_days: 30
  disk_pressure_pct: 85
  archive_root: "/opt/forensic-orchestrator/storage/archive"
  compress_evidence_min_bytes: 1048576   # сжимать только evidence-файлы >= 1 MiB
  retention_days: 0                      # 0 = никогда не удалять автоматически
